name: CI

# Runs on every push and pull request. Needs no secrets.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Check the page parses and keeps its structure
        run: node scripts/check-html.mjs
